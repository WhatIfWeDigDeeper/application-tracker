version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/user/application-tracker/go-api

run:
  timeout: 5m
