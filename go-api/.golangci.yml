linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/user/application-tracker/go-api

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

run:
  timeout: 5m
