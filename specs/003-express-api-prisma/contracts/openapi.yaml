openapi: 3.0.3
info:
  title: Application Tracker API
  version: 1.0.0
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /applications:
    get:
      summary: List applications
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: companyCategory
          schema:
            type: string
        - in: query
          name: jobSource
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplication'
    post:
      summary: Create application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
  /applications/{id}:
    get:
      summary: Get application by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
    patch:
      summary: Update application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
    delete:
      summary: Delete application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /applications/{id}/interview-stages:
    post:
      summary: Add interview stage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewStageInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStage'
  /applications/{id}/interview-stages/{stageId}:
    patch:
      summary: Update interview stage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: stageId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewStageInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewStage'
    delete:
      summary: Delete interview stage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: stageId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

components:
  schemas:
    JobApplication:
      type: object
      properties:
        id:
          type: string
        companyName:
          type: string
        positionTitle:
          type: string
        dateApplied:
          type: string
          format: date-time
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        companyUrl:
          type: string
        jobPostingUrl:
          type: string
        companyCareerUrl:
          type: string
        companyCategory:
          type: string
        skillsMatch:
          type: integer
        jobSource:
          type: string
        coverLetterRequired:
          type: boolean
        specialRequirements:
          type: string
        salaryMin:
          type: integer
        salaryMax:
          type: integer
        notes:
          type: string
        offerDueDate:
          type: string
          format: date-time
        isArchived:
          type: boolean
        interviewStages:
          type: array
          items:
            $ref: '#/components/schemas/InterviewStage'
    InterviewStage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        order:
          type: integer
        isCompleted:
          type: boolean
        completedDate:
          type: string
          format: date-time
        notes:
          type: string
        performanceRating:
          type: integer
    CreateApplicationInput:
      type: object
      required: [companyName, positionTitle]
      properties:
        companyName:
          type: string
        positionTitle:
          type: string
        dateApplied:
          type: string
          format: date-time
        companyUrl:
          type: string
        jobPostingUrl:
          type: string
        companyCareerUrl:
          type: string
        companyCategory:
          type: string
        skillsMatch:
          type: integer
        jobSource:
          type: string
        coverLetterRequired:
          type: boolean
        specialRequirements:
          type: string
        salaryMin:
          type: integer
        salaryMax:
          type: integer
        notes:
          type: string
    UpdateApplicationInput:
      type: object
      properties:
        companyName:
          type: string
        positionTitle:
          type: string
        dateApplied:
          type: string
          format: date-time
        status:
          type: string
        companyUrl:
          type: string
        jobPostingUrl:
          type: string
        companyCareerUrl:
          type: string
        companyCategory:
          type: string
        skillsMatch:
          type: integer
        jobSource:
          type: string
        coverLetterRequired:
          type: boolean
        specialRequirements:
          type: string
        salaryMin:
          type: integer
        salaryMax:
          type: integer
        notes:
          type: string
        offerDueDate:
          type: string
          format: date-time
