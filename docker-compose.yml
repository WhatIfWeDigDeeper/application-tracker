version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    container_name: app_tracker_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_tracker_network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: app_tracker_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/app_tracker?schema=svelte_hono}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_tracker_network
    command: sh -c "npm run prisma:migrate:deploy && npm run dev"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: app_tracker_ui
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - app_tracker_network

volumes:
  postgres_data:

networks:
  app_tracker_network:
    driver: bridge
      - ./ui/src:/app/src
  default:
    name: app-tracker-network
