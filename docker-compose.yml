services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    container_name: app_tracker_dynamodb
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    user: root
    volumes:
      - ./data/dynamodb:/data
    networks:
      - app_tracker_network

  localstack:
    image: localstack/localstack:4
    container_name: app_tracker_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda,dynamodb,apigatewayv2
      - DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - LAMBDA_EXECUTOR=local
    volumes:
      - ./data/localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - localstack
    networks:
      - app_tracker_network

  postgres:
    image: postgres:18-alpine
    container_name: app_tracker_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_tracker_network

volumes:
  postgres_data:

networks:
  app_tracker_network:
    driver: bridge
  default:
    name: app-tracker-network
