version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: [
          "version-update:semver-major",
          "version-update:semver-minor"
        ]
    cooldown:
      semver-patch-days: 2

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: [
          "version-update:semver-major",
          "version-update:semver-minor"
        ]
    cooldown:
      semver-patch-days: 2
