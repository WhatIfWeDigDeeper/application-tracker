name: Verify PR

on:
  pull_request:
    branches: [main]

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  # OWASP dependency-check requires additional heap on CI runners.
  GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false

jobs:
  build:
    name: verify-pr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for docs-only changes
        id: docs-check
        uses: tj-actions/changed-files@v47
        with:
          files: |
            docs/**
            *.md
            **/*.md
            **/*.mermaid
            **/*.txt
            docs/**/*.png
            docs/**/*.jpg
            .agent*/**
            .claude/**
            .github/**/*.md
            .specifykit/**
            .vscode/**
            .gitignore
            docker-compose.yml
            cspell.config.yaml
            skills-lock.json
          files_ignore: |
            package.json
            **/package.json

      - name: Use Node.js from .node-version
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install uv and Python
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        if: steps.docs-check.outputs.only_changed == 'false'
        run: cd fastapi && uv sync --extra dev

      - name: Set up Java 21
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: gradle/actions/setup-gradle@v6

      - name: Get date for NVD cache key
        if: steps.docs-check.outputs.only_changed == 'false'
        id: date
        run: echo "today=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache NVD dependency-check database
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: actions/cache@v5
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-data-${{ runner.os }}-${{ steps.date.outputs.today }}
          restore-keys: nvd-data-${{ runner.os }}-

      - name: Set up Go
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: actions/setup-go@v6
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.sum

      - name: Install govulncheck
        if: steps.docs-check.outputs.only_changed == 'false'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install golangci-lint
        if: steps.docs-check.outputs.only_changed == 'false'
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.10.1

      - name: Install buf
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Run Security Audit
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run audit:ci:all

      - name: Install npm packages
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run ci:all

      - name: Lint
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run lint:all

      - name: Build
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run build:all

      - name: Test
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run test:all
