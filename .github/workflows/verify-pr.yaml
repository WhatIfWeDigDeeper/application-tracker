name: Verify PR

on:
  pull_request:
    branches: [main]

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  # OWASP dependency-check requires additional heap on CI runners.
  GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false

jobs:
  build:
    name: verify-pr
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for docs-only changes
        id: docs-check
        uses: tj-actions/changed-files@v47
        with:
          files: |
            docs/**
            *.md
            **/*.md
            **/*.mermaid
            **/*.txt
            docs/**/*.png
            docs/**/*.jpg
            .agent*/**
            .claude/**
            .github/**/*.md
            .specifykit/**
            .vscode/**
            .gitignore
            docker-compose.yml
            cspell.config.yaml
            skills-lock.json
          files_ignore: |
            package.json
            **/package.json

      - name: Use Node.js from .node-version
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Install uv and Python
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        if: steps.docs-check.outputs.only_changed == 'false'
        run: cd fastapi && uv sync --extra dev

      - name: Set up Java 21
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Go
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: actions/setup-go@v6
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.sum

      - name: Install govulncheck
        if: steps.docs-check.outputs.only_changed == 'false'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install golangci-lint
        if: steps.docs-check.outputs.only_changed == 'false'
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.10.1

      - name: Install buf
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Set up Ruby
        if: steps.docs-check.outputs.only_changed == 'false'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: rails-api/.ruby-version
          bundler-cache: true
          working-directory: rails-api

      - name: Run Security Audit
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run audit:ci:all

      - name: Install npm packages
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run ci:all

      - name: Lint
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run lint:all

      - name: Check proto breaking changes
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run proto:breaking

      - name: Build
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run build:all

      - name: Prepare Rails test database
        if: steps.docs-check.outputs.only_changed == 'false'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_tracker
          RAILS_ENV: test
        run: cd rails-api && bin/with-ruby bundle exec rails db:migrate

      - name: Test
        if: steps.docs-check.outputs.only_changed == 'false'
        run: npm run test:all
