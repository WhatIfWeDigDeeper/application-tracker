<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- GraphQL logo: two overlapping triangles (Star of David) + 6 outer dots -->
  <!-- Triangle 1: vertices 0,2,4 (top, bottom-right, bottom-left) -->
  <polygon points="16,3 27.3,22.5 4.7,22.5" fill="none" stroke="#E10098" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Triangle 2: vertices 1,3,5 (top-right, bottom, top-left) -->
  <polygon points="27.3,9.5 16,29 4.7,9.5" fill="none" stroke="#E10098" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 6 dots at hexagon vertices -->
  <circle cx="16"   cy="3"    r="2" fill="#E10098"/>
  <circle cx="27.3" cy="9.5"  r="2" fill="#E10098"/>
  <circle cx="27.3" cy="22.5" r="2" fill="#E10098"/>
  <circle cx="16"   cy="29"   r="2" fill="#E10098"/>
  <circle cx="4.7"  cy="22.5" r="2" fill="#E10098"/>
  <circle cx="4.7"  cy="9.5"  r="2" fill="#E10098"/>
</svg>
