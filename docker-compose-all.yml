services:
  postgres:
    image: postgres:18-alpine
    container_name: app_tracker_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_tracker_network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: app_tracker_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/app_tracker?schema=express_prisma}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_tracker_network
    command: sh -c "npm run prisma:migrate:deploy && npm run dev"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: app_tracker_ui
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - app_tracker_network

  go-api:
    build:
      context: ./go-api
      dockerfile: Dockerfile
    ports:
      - "5070:5070"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app_tracker?search_path=go_gin
      - PORT=5070
      - CORS_ORIGIN=http://localhost:3060
    depends_on:
      - postgres
    networks:
      - app_tracker_network

  angular-ui:
    build:
      context: ./angular-ui
      dockerfile: Dockerfile
    container_name: app_tracker_angular_ui
    ports:
      - "${ANGULAR_UI_PORT:-3060}:3060"
    depends_on:
      - go-api
    networks:
      - app_tracker_network

volumes:
  postgres_data:

networks:
  app_tracker_network:
    driver: bridge
  default:
    name: app-tracker-network
