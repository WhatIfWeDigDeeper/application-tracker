version: v2
plugins:
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: nest-history-api/src/generated
    opt:
      - nestJs=true
      - outputServices=grpc-js
      - esModuleInterop=true
      - useOptionals=messages
      - oneof=unions
      - stringEnums=false
      - removeEnumPrefix=false
  - local: ./node_modules/.bin/protoc-gen-ts_proto
    out: nest-api/src/generated
    opt:
      - nestJs=true
      - outputServices=grpc-js
      - esModuleInterop=true
      - useOptionals=messages
      - oneof=unions
      - stringEnums=false
      - removeEnumPrefix=false
inputs:
  - directory: proto
